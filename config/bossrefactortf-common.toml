
#Shared attack-range telegraph rendering settings.
[attack_telegraph]
	#Render attack-range telegraphs.
	enabled = true
	#Maximum render distance.
	#Range: 8.0 ~ 512.0
	max_render_distance = 96.0
	#Red channel.
	#Range: 0 ~ 255
	red = 255
	#Green channel.
	#Range: 0 ~ 255
	green = 35
	#Blue channel.
	#Range: 0 ~ 255
	blue = 35
	#Outline alpha.
	#Range: 0 ~ 255
	alpha = 210
	#Requested line width; graphics hardware may clamp it.
	#Range: 1.0 ~ 12.0
	line_width = 5.0
	#Fill marked attack areas.
	fill_enabled = true
	#Fill alpha at windup start.
	#Range: 0 ~ 255
	fill_start_alpha = 20
	#Fill alpha at windup completion.
	#Range: 0 ~ 255
	fill_end_alpha = 150
	#Segments used for circles and arcs.
	#Range: 8 ~ 256
	curve_segments = 48
	#Vertical telegraph offset.
	#Range: -4.0 ~ 4.0
	height_offset = 0.08

#Knight Phantom encounter refactor settings.
[knight_phantom]
	#Enable all Knight Phantom refactor mechanics.
	enabled = true

	#Base traits.
	[knight_phantom.base_traits]
		#Increase fire damage received by Knight Phantoms.
		fire_vulnerability_enabled = true
		#Multiplier applied to incoming fire damage. 2.0 is +100% damage.
		#Range: 0.0 ~ 100.0
		fire_damage_multiplier = 2.0
		#Scale speed and damage for each fallen member of the group.
		fallen_knight_scaling_enabled = true
		#Movement-speed bonus per fallen Knight Phantom. 0.05 is +5%.
		#Range: 0.0 ~ 10.0
		speed_bonus_per_fallen_knight = 0.05
		#Damage bonus per fallen Knight Phantom. 0.05 is +5%.
		#Range: 0.0 ~ 10.0
		damage_bonus_per_fallen_knight = 0.05
		#Make non-possessed Knight Phantoms avoid nearby players.
		player_avoidance_enabled = true
		#Minimum horizontal player distance for non-possessed knights.
		#Range: 0.0 ~ 64.0
		player_avoidance_distance = 10.0

	#Sequential Knight Charge.
	[knight_phantom.charge]
		#Enable sequential Knight Charges.
		enabled = true
		#Windup before each knight's first charge, in ticks.
		#Range: 0 ~ 1200
		windup_ticks = 30
		#Maximum duration of one charge, in ticks.
		#Range: 1 ~ 1200
		duration_ticks = 50
		#Possessed melee-output time after the final charge segment, in ticks.
		#Range: 0 ~ 1200
		post_charge_possession_ticks = 60
		#Movement-speed multiplier while charging.
		#Range: 0.0 ~ 20.0
		speed_multiplier = 3.0
		#Attack-damage multiplier for a charge hit. 1.2 is 120% damage.
		#Range: 0.0 ~ 100.0
		damage_multiplier = 1.2
		#Extra reach around the charging knight and its telegraph.
		#Range: 0.0 ~ 16.0
		hitbox_inflation = 0.25
		#Allow charges to hit non-allied living entities other than players.
		hits_non_players = true
		#Put a player's used shield on cooldown after it blocks a charge.
		shield_cooldown_enabled = true
		#Shield cooldown after blocking a charge, in ticks. 60 ticks is 3 seconds.
		#Range: 0 ~ 1200
		shield_cooldown_ticks = 60
		#Allow optional SlashBlade SenDimS integration to parry charges.
		slashblade_parry_enabled = true
		#Cancel every remaining charge of the parried knight, then continue the round.
		parry_cancels_remaining_charges = true
		#Delay after a possessed knight dies before the next knight begins its windup, in ticks.
		#Range: 0 ~ 1200
		death_handoff_delay_ticks = 30
		#Maximum horizontal distance of one locked straight-line charge.
		#Range: 0.0 ~ 128.0
		maximum_distance = 30.0
		#Parry feedback and stationary vulnerability duration, in ticks.
		#Range: 1 ~ 1200
		parry_stun_ticks = 40

	#Last Knight phase.
	[knight_phantom.last_knight]
		#Enable the Last Knight phase.
		enabled = true
		#Fully heal the final Knight Phantom when the phase begins.
		full_heal_enabled = true
		#Reduce incoming damage during the Last Knight phase.
		damage_reduction_enabled = true
		#Fraction of incoming damage prevented. 0.5 is 50% reduction.
		#Range: 0.0 ~ 1.0
		damage_reduction = 0.5
		#Make the final Knight Phantom charge repeatedly after one windup.
		multi_charge_enabled = true
		#Number of consecutive charges used by the final Knight Phantom.
		#Range: 1 ~ 100
		charge_count = 3
		#Windup before each final-knight charge segment, in ticks.
		#Range: 0 ~ 1200
		windup_ticks = 15

#Alpha Yeti combat refactor settings.
[alpha_yeti]
	#Enable the complete Alpha Yeti combat takeover.
	enabled = true
	#Minimum cruise duration after a skill, in ticks.
	#Range: 1 ~ 1200
	cruise_minimum_ticks = 20
	#Maximum cruise duration after a skill, in ticks.
	#Range: 1 ~ 1200
	cruise_maximum_ticks = 50
	#Rest duration after reaching three fatigue, in ticks.
	#Range: 1 ~ 2400
	rest_duration_ticks = 200

	#Ice Rampage.
	[alpha_yeti.rampage]
		#Rampage duration, in ticks.
		#Range: 1 ~ 2400
		duration_ticks = 180
		#Marked maximum horizontal danger range for rampage effects.
		#Range: 1.0 ~ 128.0
		range = 30.0

	#Enraged Pursuit.
	[alpha_yeti.pursuit]
		#Stationary roar windup, in ticks.
		#Range: 1 ~ 1200
		roar_ticks = 20
		#Pursuit duration, in ticks.
		#Range: 1 ~ 2400
		duration_ticks = 120
		#Ticks between 100% attack-damage pulses.
		#Range: 1 ~ 1200
		damage_interval_ticks = 20
		#Extra horizontal reach around the Alpha Yeti during pursuit.
		#Range: 0.0 ~ 16.0
		hitbox_inflation = 0.5
		#Ticks between continuous pursuit knockback pulses.
		#Range: 1 ~ 1200
		knockback_interval_ticks = 5
		#Strength of each pursuit knockback pulse.
		#Range: 0.0 ~ 16.0
		knockback_strength = 0.6
		#Navigation speed multiplier during pursuit.
		#Range: 0.0 ~ 20.0
		speed_multiplier = 1.5

	#Frost Beast Stomp.
	[alpha_yeti.stomp]
		#Stomp windup, in ticks.
		#Range: 1 ~ 1200
		windup_ticks = 30
		#Radius of the 150% stomp hit.
		#Range: 1.0 ~ 64.0
		radius = 10.0
		#Horizontal knockback from the stomp hit.
		#Range: 0.0 ~ 16.0
		horizontal_knockback = 0.8
		#Minimum upward velocity from the stomp hit.
		#Range: 0.0 ~ 16.0
		vertical_velocity = 1.0
		#Number of sequential falling-ice rings.
		#Range: 1 ~ 32
		falling_ice_ring_count = 4
		#Radius reached by the final falling-ice ring.
		#Range: 1.0 ~ 64.0
		falling_ice_maximum_radius = 12.0
		#Warning time for each falling-ice ring, in ticks.
		#Range: 1 ~ 1200
		falling_ice_ring_windup_ticks = 20
		#Visible falling-ice blocks spawned around each ring.
		#Range: 1 ~ 128
		falling_ice_per_ring = 12
		#Preferred height above impact points for falling ice.
		#Range: 2.0 ~ 64.0
		falling_ice_spawn_height = 10.0

	#Second phase.
	[alpha_yeti.second_phase]
		#Warning time for independent falling ice, in ticks.
		#Range: 1 ~ 1200
		falling_ice_windup_ticks = 20
		#Impact radius of independent falling ice.
		#Range: 0.5 ~ 32.0
		falling_ice_radius = 2.5
		#Visible falling-ice blocks per independent impact.
		#Range: 1 ~ 64
		falling_ice_count = 6

	#Optional SlashBlade parry integration.
	[alpha_yeti.parry]
		#Allow SlashBlade parries to add pursuit imbalance.
		slashblade_enabled = true
		#Feedback duration returned to the parry integration, in ticks.
		#Range: 1 ~ 1200
		feedback_ticks = 10

#Ur-Ghast combat takeover settings.
[ur_ghast]
	#Enable the complete Ur-Ghast combat takeover.
	enabled = true
	#Base attack damage used by custom Ur-Ghast skills.
	#Range: 0.0 ~ 1000.0
	base_attack_damage = 10.0
	#Minimum ticks between Ur-Ghast hurt sounds.
	#Range: 0 ~ 1200
	hurt_sound_cooldown_ticks = 20
	#Incoming damage fraction prevented while enraged. 0.75 is 75%.
	#Range: 0.0 ~ 1.0
	tantrum_damage_reduction = 0.75
	#Maximum-health percentage lost between minion summon waves.
	#Range: 0.1 ~ 100.0
	minion_summon_health_interval_percent = 6.0

	#Patrol and offensive mode switching.
	[ur_ghast.modes]
		#Duration of each mode, in ticks.
		#Range: 1 ~ 12000
		duration_ticks = 400
		#Flight-speed multiplier in offensive mode.
		#Range: 0.0 ~ 10.0
		offensive_speed_multiplier = 1.3
		#Offensive chase height above the target's feet.
		#Range: -32.0 ~ 64.0
		offensive_height_offset = 4.0
		#Fraction of trap control retained in offensive mode.
		#Range: 0.0 ~ 1.0
		offensive_trap_duration_multiplier = 0.5

	#Giant Fireball.
	[ur_ghast.fireball]
		#Fireball windup, in ticks.
		#Range: 1 ~ 1200
		windup_ticks = 20
		#Delay between ordinary fireball attacks, in ticks.
		#Range: 1 ~ 2400
		cooldown_ticks = 60
		#Center damage multiplier. 1.5 is 150% attack damage.
		#Range: 0.0 ~ 100.0
		damage_multiplier = 1.5
		#Half-size of the moving explosion AABB.
		#Range: 0.1 ~ 64.0
		explosion_radius = 4.0
		#Burn duration applied by a fireball hit, in ticks.
		#Range: 0 ~ 12000
		ignite_ticks = 100
		#Client-side visual scale of Ur-Ghast fireballs. Vanilla is 3.0.
		#Range: 0.1 ~ 64.0
		visual_scale = 9.0

	#Arsenic-Lead Mist.
	[ur_ghast.mist]
		#Harmless mist warning duration, in ticks.
		#Range: 1 ~ 2400
		windup_ticks = 60
		#Mist damage duration after teleporting, in ticks.
		#Range: 1 ~ 2400
		damage_duration_ticks = 100
		#Mist skill cooldown, in ticks.
		#Range: 1 ~ 12000
		cooldown_ticks = 200
		#Ticks between mist damage pulses.
		#Range: 1 ~ 1200
		damage_interval_ticks = 20
		#Damage per mist pulse. 0.2 is 20% attack damage.
		#Range: 0.0 ~ 100.0
		damage_multiplier = 0.2
		#Horizontal radius of each mist column.
		#Range: 0.1 ~ 64.0
		radius = 6.0
		#Height of each mist column.
		#Range: 1.0 ~ 128.0
		height = 24.0
		#Teleport height above the destination patrol point.
		#Range: 0.0 ~ 128.0
		teleport_height = 20.0
		#Crimson mist particles emitted per column update.
		#Range: 1 ~ 128
		particles_per_column = 8

	#Enraged visual effects.
	[ur_ghast.tantrum_visuals]
		#Additional red smoke particles emitted each client tick.
		#Range: 0 ~ 64
		red_smoke_particles_per_tick = 4
		#Ticks between red energy rings.
		#Range: 1 ~ 1200
		energy_ring_interval_ticks = 10
		#Particles in each red energy ring.
		#Range: 4 ~ 256
		energy_ring_particles = 24

