		#Range: 0 ~ 100
		basic_attacks_before_spear = 2
		#Initial martial-skill delay.
		#武神技初始延迟。
		#Range: 0 ~ 72000
		initial_skill_delay_ticks = 60
		#Initial Spear Throw delay.
		#长枪投掷初始延迟。
		#Range: 0 ~ 72000
		initial_spear_delay_ticks = 160
		#Cooldown shared by Martial Skill I and II.
		#武神技一和二共用冷却。
		#Range: 0 ~ 72000
		skill_cooldown_ticks = 160
		#Spear Throw cooldown.
		#武神技·投掷冷却。
		#Range: 0 ~ 72000
		spear_cooldown_ticks = 260
		#Chance for Martial Skill I to chain into Martial Skill II.
		#武神技一衔接武神技二的概率。
		#Range: 0.0 ~ 1.0
		skill_one_chain_chance = 0.5
		#Whether the Queen pathfinds to a target's side before attacking.
		#武神女王是否在攻击前寻路切入目标侧方。
		tactical_flanking_enabled = true
		#Range used to reacquire the nearest eligible player during a boss fight.
		#Boss 战中重新捕获最近合格玩家的追击范围。
		#Range: 0.0 ~ 128.0
		pursuit_range = 48.0
		#Pathfinding speed used by direct pursuit.
		#直接追击时的寻路速度。
		#Range: 0.0 ~ 10.0
		approach_speed = 1.1
		#Pathfinding speed used while moving to a target's side.
		#切入目标侧方时的寻路速度。
		#Range: 0.0 ~ 10.0
		flank_speed = 1.35
		#Desired distance from the target at a flank point.
		#侧翼点与目标之间的期望距离。
		#Range: 0.0 ~ 128.0
		flank_distance = 3.5
		#Horizontal distance at which a flank point counts as reached.
		#判定已抵达侧翼点的水平距离。
		#Range: 0.0 ~ 128.0
		flank_arrival_distance = 1.15
		#Distance below which the Queen attacks immediately instead of circling.
		#低于此距离时武神女王直接攻击，不再绕行切侧。
		#Range: 0.0 ~ 128.0
		flank_bypass_distance = 2.0
		#Random weight for each side; the remaining weight selects the rear.
		#每个侧方的随机权重，剩余权重用于选择后方。
		#Range: 0.05 ~ 0.45
		side_approach_weight = 0.35
		#Ticks between flank-path updates.
		#侧翼寻路重算间隔，单位为 tick。
		#Range: 1 ~ 200
		flank_repath_ticks = 8
		#Expected tactical-movement time; timing out prepares the next skill.
		#战术移动预期时间；超时后直接准备下一项技能，单位为 tick。
		#Range: 1 ~ 72000
		tactical_movement_timeout_ticks = 40
		#Whether the Queen actively jumps over obstacles while pursuing.
		#武神女王追击时是否主动跳过障碍。
		chase_jump_enabled = true
		#Target height advantage that can trigger a chase jump.
		#可触发追击跳跃的目标高度差。
		#Range: 0.0 ~ 128.0
		chase_jump_height_threshold = 0.6
		#Maximum horizontal target distance for height-triggered jumping.
		#高度差触发跳跃时允许的最大水平距离。
		#Range: 0.0 ~ 128.0
		chase_jump_trigger_distance = 4.5

