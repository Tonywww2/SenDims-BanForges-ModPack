#Attack-range outline rendering using Minecraft's built-in line shader.
#使用 Minecraft 内置线条着色器渲染攻击范围轮廓。
[attack_telegraph]
	#Render red attack-range outlines.
	#渲染红色攻击范围轮廓。
	enabled = true
	#Maximum render distance.
	#最大渲染距离。
	#Range: 8.0 ~ 512.0
	max_render_distance = 96.0
	#Red channel.
	#红色通道。
	#Range: 0 ~ 255
	red = 255
	#Green channel.
	#绿色通道。
	#Range: 0 ~ 255
	green = 35
	#Blue channel.
	#蓝色通道。
	#Range: 0 ~ 255
	blue = 35
	#Outline alpha.
	#轮廓透明度。
	#Range: 0 ~ 255
	alpha = 210
	#Requested shader line width; hardware may clamp it.
	#请求的着色器线宽；显卡可能限制实际值。
	#Range: 1.0 ~ 12.0
	line_width = 5.0
	#Fill the marked attack area with translucent color.
	#使用半透明颜色填充标记的攻击区域。
	fill_enabled = true
	#Fill alpha at the beginning of the windup.
	#前摇开始时的填充透明度。
	#Range: 0 ~ 255
	fill_start_alpha = 20
	#Fill alpha when the windup is almost complete.
	#前摇即将完成时的填充透明度。
	#Range: 0 ~ 255
	fill_end_alpha = 150
	#Segments used for circles and arcs.
	#圆形和扇形使用的分段数。
	#Range: 8 ~ 256
	curve_segments = 48
	#Vertical outline offset.
	#轮廓垂直偏移。
	#Range: -4.0 ~ 4.0
	height_offset = 0.08

