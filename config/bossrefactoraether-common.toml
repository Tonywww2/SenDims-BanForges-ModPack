
#Shared out-of-combat healing for all three bosses.
#三种 Boss 共用的脱战回血设置。
[boss_recovery]
	#Enable out-of-combat boss healing.
	#是否启用 Boss 脱战回血。
	enabled = true
	#Ticks without a valid target between heals.
	#每次回血前需要持续无有效目标的 tick 数。
	#Range: 1 ~ 72000
	interval_ticks = 20
	#Flat health restored each interval.
	#每次回复的固定生命值。
	#Range: 0.0 ~ 1000000.0
	flat_healing = 5.0
	#Maximum-health ratio restored each interval.
	#每次按最大生命值比例回复的生命值。
	#Range: 0.0 ~ 1.0
	max_health_ratio = 0.05

#Aether Slider settings.
#滑行魔石设置。
[slider]

	#Core Slider combat rules.
	#滑行魔石核心战斗规则。
	[slider.combat]
		#Phase-two health threshold ratio.
		#二阶段生命比例阈值。
		#Range: 0.0 ~ 1.0
		phase_two_health_ratio = 0.5
		#Maximum Stone Barrier layers.
		#石质屏障最大层数。
		#Range: 0 ~ 100
		max_barrier_layers = 5
		#Maximum Glide Power layers.
		#滑行力最大层数。
		#Range: 1 ~ 100
		max_glide_power = 10
		#Minimum phase-two Glide Power outside stun.
		#二阶段非眩晕时的最低滑行力。
		#Range: 0 ~ 100
		phase_two_min_glide_power = 2
		#Glide Power consumed by Continuous Glide.
		#连续滑行消耗的滑行力。
		#Range: 1 ~ 100
		continuous_glide_cost = 6
		#Phase-two damage multiplier.
		#二阶段伤害倍率。
		#Range: 0.0 ~ 100.0
		phase_two_damage_multiplier = 1.2
		#Damage added by each Glide Power layer.
		#每层滑行力增加的伤害倍率。
		#Range: 0.0 ~ 10.0
		glide_power_damage_per_layer = 0.02
		#Damage reduction per Stone Barrier layer.
		#每层石质屏障提供的伤害减免。
		#Range: 0.0 ~ 1.0
		barrier_reduction_per_layer = 0.05
		#Recovery duration after a successful parry, in ticks.
		#成功招架后的恢复时间，单位为 tick。
		#Range: 1 ~ 72000
		parry_recovery_ticks = 60
		#Stun duration after barrier break, in ticks.
		#屏障全部破碎后的眩晕时间，单位为 tick。
		#Range: 0 ~ 72000
		stun_ticks = 100
		#Shield cooldown after blocking, in ticks.
		#成功格挡后的盾牌冷却，单位为 tick。
		#Range: 0 ~ 72000
		shield_cooldown_ticks = 60
		#Phase-one Continuous Glide dash count.
		#一阶段连续滑行冲刺次数。
		#Range: 1 ~ 100
		phase_one_continuous_glide_dashes = 2
		#Phase-two Continuous Glide dash count.
		#二阶段连续滑行冲刺次数。
		#Range: 1 ~ 100
		phase_two_continuous_glide_dashes = 3
		#Chance for one extra dash.
		#额外追加一次冲刺的概率。
		#Range: 0.0 ~ 1.0
		extra_dash_chance = 0.5
		#Required charged-pickaxe attack strength.
		#满蓄力镐攻击所需的攻击强度。
		#Range: 0.0 ~ 1.0
		full_pickaxe_attack_strength = 1.0
		#Make the Slider immune to all HARMFUL mob effects and remove existing harmful effects.
		#使滑行魔石免疫全部 HARMFUL 负面效果，并清除已有负面效果。
		immune_to_negative_effects = true
		#Prevent entities outside the Slider's room from damaging it. Indirect damage uses the causing entity, such as the projectile owner.
		#阻止魔石房间外的实体对其造成伤害。间接伤害按实际来源实体判定，例如投射物主人。
		prevent_outside_arena_damage = true
		#Glide Power gained after completing one arena edge.
		#每完成一条场地边缘巡航时获得的滑行力。
		#Range: 0 ~ 100
		glide_power_gain_per_patrol_edge = 2
		#Glide Power gained when one Stone Barrier layer is removed.
		#失去一层石质屏障时获得的滑行力。
		#Range: 0 ~ 100
		glide_power_gain_on_barrier_break = 1
		#Make the first phase-two Continuous Glide dash unblockable and unparryable.
		#使二阶段连续滑行的第一次冲刺不可格挡且不可招架。
		phase_two_first_dash_unblockable = true

	#Damage is composed before phase and Glide Power multipliers.
	#先计算基础伤害，再应用阶段和滑行力倍率。
	[slider.damage]

		#Collision during normal perimeter patrol.
		#普通周界巡航期间的碰撞伤害。
		[slider.damage.normal_collision]
			#Flat damage before the attack contribution.
			#攻击力贡献之前的固定伤害。
			#Range: 0.0 ~ 1000000.0
			base_damage = 2.0
			#Current attack-damage multiplier. Formula: base + attack * multiplier.
			#当前攻击力倍率。公式：固定伤害 + 攻击力 * 倍率。
			#Range: 0.0 ~ 1000.0
			attack_damage_multiplier = 1.0

		#Continuous Glide dash.
		#连续滑行冲刺。
		[slider.damage.chain_dash]
			#Flat damage before the attack contribution.
			#攻击力贡献之前的固定伤害。
			#Range: 0.0 ~ 1000000.0
			base_damage = 0.0
			#Current attack-damage multiplier. Formula: base + attack * multiplier.
			#当前攻击力倍率。公式：固定伤害 + 攻击力 * 倍率。
			#Range: 0.0 ~ 1000.0
			attack_damage_multiplier = 1.5

	#Movement speed settings for the Aether Slider.
	#滑行魔石移动速度设置。
	#Base speed is relative to the original Aether maximum speed.
	#基础速度相对于天境原始最大速度。
	#Phase, Glide Power, and action multipliers are applied afterward.
	#之后应用阶段、滑行力和动作倍率。
	[slider.movement]
		#Overall multiplier before phase and Glide Power.
		#阶段和滑行力之前应用的总倍率。
		#Range: 0.0 ~ 10.0
		base_speed_multiplier = 0.4
		#Speed multiplier during phase two.
		#二阶段速度倍率。
		#Range: 0.0 ~ 10.0
		phase_two_speed_multiplier = 1.2
		#Speed added by each Glide Power layer.
		#每层滑行力增加的速度倍率。
		#Range: 0.0 ~ 1.0
		glide_power_speed_per_layer = 0.02
		#Multiplier while moving vertically into attack height.
		#纵向移动到可攻击高度时的速度倍率。
		#Range: 0.0 ~ 10.0
		vertical_alignment_speed_multiplier = 0.65
		#Multiplier while moving to the nearest arena edge.
		#移动到最近场地边缘时的速度倍率。
		#Range: 0.0 ~ 10.0
		edge_return_speed_multiplier = 0.75
		#Multiplier while patrolling the square arena perimeter.
		#沿方形场地边缘巡航时的速度倍率。
		#Range: 0.0 ~ 10.0
		perimeter_patrol_speed_multiplier = 0.5
		#Multiplier while continuously chasing the current player.
		#持续追击当前玩家时的速度倍率。
		#Range: 0.0 ~ 10.0
		chase_speed_multiplier = 1.0
		#Multiplier for Continuous Glide dashes.
		#连续滑行冲刺速度倍率。
		#Range: 0.0 ~ 10.0
		chain_dash_speed_multiplier = 1.6
		#Base acceleration per tick for owned chase movement.
		#本模组接管追击时每 tick 的基础加速度。
		#Range: 0.0 ~ 10.0
		chase_acceleration = 0.021666666666666667

	#Slider timing in ticks.
	#滑行魔石时间参数，单位为 tick。
	[slider.timing]
		#Continuous Glide windup.
		#连续滑行前摇。
		#Range: 0 ~ 72000
		continuous_glide_windup_ticks = 30
		#Maximum duration of each dash.
		#每次连续冲刺的最大持续时间。
		#Range: 1 ~ 72000
		continuous_glide_dash_tick_limit = 10
		#Pause between dashes.
		#连续冲刺之间的停顿时间。
		#Range: 0 ~ 72000
		continuous_glide_interval_ticks = 4
		#Ticks of player velocity used to lead Continuous Glide aim.
		#连续滑行瞄准时用于预判玩家速度的 tick 数。
		#Range: 0 ~ 72000
		continuous_glide_prediction_ticks = 8
		#Pause after normal perimeter movement reaches a corner.
		#普通周界移动抵达角点后的停留时间。
		#Range: 0 ~ 72000
		perimeter_corner_pause_ticks = 15

	#Slider range and geometry.
	#滑行魔石范围与几何参数。
	[slider.range]
		#Maximum dash distance.
		#连续滑行单次冲刺最大距离。
		#Range: 0.0 ~ 128.0
		continuous_glide_distance = 12.0
		#Maximum horizontal player-velocity lead distance.
		#按玩家水平速度预判时允许的最大领先距离。
		#Range: 0.0 ~ 128.0
		continuous_glide_max_lead_distance = 4.0
		#Extra clearance between the Slider and arena walls.
		#魔石与场地墙体之间的额外间距。
		#Range: 0.0 ~ 128.0
		perimeter_edge_clearance = 0.35
		#Distance used to accept an edge or corner as reached.
		#判定到达场地边缘或角点的距离。
		#Range: 0.0 ~ 128.0
		perimeter_arrival_tolerance = 0.12
		#Allowed center-height difference after vertical alignment.
		#纵向对齐完成后允许的中心高度差。
		#Range: 0.0 ~ 128.0
		vertical_alignment_tolerance = 0.1
		#Authoritative horizontal combat-room radius, including tracked dungeons.
		#滑行魔石实际战斗房间的水平半径，包括有地牢追踪器的房间。
		#Range: 1.0 ~ 128.0
		standalone_room_horizontal_radius = 11.0
		#Authoritative vertical combat-room radius, including tracked dungeons.
		#滑行魔石实际战斗房间的垂直半径，包括有地牢追踪器的房间。
		#Range: 1.0 ~ 128.0
		standalone_room_vertical_radius = 7.0

	#Slider client display settings.
	#滑行魔石客户端显示设置。
	[slider.display]
		#Status-label height above the Slider's bounding box.
		#状态标签高于魔石碰撞箱顶部的高度。
		#Range: 0.0 ~ 8.0
		status_label_height_offset = 1.35

#Valkyrie Queen settings.
#武神女王设置。
