
#Read before Forge config loading. All startup changes require a full game restart.
[startup]
	#Enable this whole group. -Dsendims.startup.enabled=false temporarily overrides it.
	enabled = true
	#Cache Mixin opcode names using an already installed agent.
	opcodeNameCache = true
	#Use the low-allocation OBJ parser with upstream syntax fallback.
	objParser = true
	#Prepare OBJ models asynchronously on the existing game executor.
	parallelObjPreparation = true
	#0 automatically chooses at most four OBJ preparation jobs.
	#Range: 0 ~ 8
	objWorkers = 0
	#Cache parsed OBJ data on disk, keyed by resource content.
	objDiskCache = true
	#Disk cache budget in MiB; 0 disables cache reads and writes.
	#Range: 0 ~ 1024
	objCacheMiB = 128
	#Larger OBJ sources use the original parser with serialized fallback.
	#Range: 1 ~ 64
	objMaxSourceMiB = 16
	#Reuse model locations during model preparation.
	modelLocationCache = true
	#Maximum model-location entries; all are released after preparation.
	#Range: 0 ~ 1048576
	modelLocationEntries = 262144
	#Batch model JSON input tasks on the existing game executor.
	modelInputBatches = true
	#0 automatically chooses at most eight jobs per JSON input category.
	#Range: 0 ~ 32
	modelWorkers = 0
	#Defer Sounds config previews on startup; keep quest HUD images eager.
	lazyConfigImages = true

[performance]

	[performance.neat]
		#Additional Neat visibility filter. Existing Neat filters still apply.
		#Allowed Values: ALL, DAMAGED_OR_TARGETED, TARGETED
		healthBars = "ALL"
		#Hide duplicate maximum HP and percentage fields; keep current HP.
		compactHealthText = false
		#Show Neat mob-type icons. Armor remains controlled by Neat's showArmor.
		attributeIcons = true

	[performance.rendering]
		#Cache static grinder sword geometry and streamline animated submission. False restores CCL rendering.
		draconicGrinderGeometry = true
		#Hard geometry-array budget per grinder renderer, including all idle poses. Zero uses upstream rendering.
		#Range: 0 ~ 16
		grinderCacheMiB = 2
		#Reuse OBJ face math scratch data. Live vertices, UV, light and render override events are preserved.
		slashbladeObjSubmission = true
		#Campfires farther than this many blocks from the camera spawn no smoke. Vanilla campfire smoke ignores particle distance. Zero keeps vanilla.
		#Range: 0 ~ 512
		campfireSmokeDistance = 64
		#Spawners farther than this many blocks from the camera skip their client tick (mob spin and flame particles). Vanilla draws spawners within 64 blocks and spawns their particles within 32. Zero keeps vanilla.
		#Range: 0 ~ 512
		spawnerClientTickDistance = 64
		#Xaero's World Map write speed and per-frame write budget multiplier. The minimap is unaffected. 1.0 keeps upstream behaviour.
		#Range: 0.1 ~ 1.0
		xaeroWorldMapWriteRate = 1.0
		#Give active energy cores a finite render box covering the core, stabilizers and beams, so cores outside the view are culled. The build guide keeps the infinite box.
		draconicEnergyCoreBounds = true
		#Brandon's Core transparent pass checks the block entity renderer type before computing render bounds; block entities without a transparent renderer skip the bounds.
		draconicTransparentPass = true
		#Write energy core, stabilizer and pylon meshes with CCL's own per-vertex math and format order, without the generic per-vertex pipeline, and reuse the pylon shell render type. False restores CCL rendering.
		draconicModelGeometry = true
		#Integrated Dynamics cable light emission reads the cable's light levels once instead of six capability lookups. Applies to the client and its integrated server.
		integratedDynamicsCableLight = true
		#Skip the Integrated Dynamics cable block entity renderer when no part on the cable has an overlay renderer (display panels, omni-directional connectors).
		integratedDynamicsCableOverlay = true
		#Render players in the shader shadow pass while Yes Steve Model is installed. False skips them there; without YSM or a shader pack nothing changes.
		ysmPlayerShadows = false

	[performance.hud]
		#Batch UIQuest background slices; preserve the original stepped gradient and text/item ordering.
		questBackgroundBatching = true
		#Cache immutable trimmed quest text by font, resource generation and width. Quest progress is never cached.
		questTrimmedTextCache = true

[holySwordVisuals]
	#Enable Caliburn/Excalibur visual effects. Client visuals only.
	enabled = true
	#Show ceiling-clipped sword curtains and sky pillars.
	skyLight = true
	#Effect opacity. Standard depth-tested emissive materials support shader packs.
	#Range: 0.15 ~ 1.5
	intensity = 1.0
	#Maximum motes drawn across all holy sword casts. No dynamic lights.
	#Range: 0 ~ 768
	moteBudget = 768
	#Beyond this distance render only the main light silhouettes.
	#Range: 16 ~ 96
	detailDistance = 48

[structureQuill]
	#Structure IDs whose preconfigured quills are shown in the creative mode tab.
	#Tooltip translation keys are generated as structure.<namespace>.<path>.
	#Changing this value requires a client restart.
	creativeTabStructures = ["minecraft:stronghold", "tofucraft:tofu_castle", "sdbf:ae_lab", "cavernous:lush_village", "cavernous:stone_village", "dungeons_arise:plague_asylum", "dungeons_arise:coliseum", "dungeons_arise:heavenly_rider", "block_factorys_bosses:underworld_arena", "ad_astra:moon_dungeon", "tetra:regular_ruin", "minecraft:bastion_remnant", "minecraft:fortress", "cataclysm:soul_black_smith", "netherman:mansion_nether", "block_factorys_bosses:kraken_ship", "midnight:forgotten_library", "block_factorys_bosses:dragon_tower", "minecraft:end_city", "undergarden:catacombs", "the_bumblezone:throne_pillar", "the_bumblezone:sempiternal_sanctum_blue", "the_bumblezone:sempiternal_sanctum_green", "the_bumblezone:sempiternal_sanctum_purple", "the_bumblezone:sempiternal_sanctum_red", "the_bumblezone:sempiternal_sanctum_white", "the_bumblezone:sempiternal_sanctum_yellow", "aether:bronze_dungeon", "aether:silver_dungeon", "sgjourney:stargate/milky_way/terra_stargate", "elder_bosses:malenia_arena", "darkerdepths:catacombs"]

[draconicEvolution]
	#The only dimension where Draconic Evolution chaos islands may affect world generation.
	#Changing this value requires a server restart.
	targetDimension = "sdbf:inside_the_end"

[ritualVisuals]
	#Shader visuals for summoning, portal, map teleport and bedrock breaker rituals. Client visuals only.
	enabled = true
	#Screen effects: teleport vortex, arrival flash and summon ripple.
	screenEffects = true
	#Overall brightness of ritual visuals.
	#Range: 0.25 ~ 1.5
	intensity = 1.0
	#Baked halo strength while an Oculus shader pack is active; lower it if a shader pack's bloom overexposes the effects.
	#Range: 0.0 ~ 1.0
	shaderPackGlow = 1.0
	#Maximum distance for ritual visuals. Summon sky beams are visible up to 160 blocks.
	#Range: 32 ~ 256
	maxDistance = 128
	#Edge length of the magic circle canvas: 512, 1024 or 2048.
	#Range: 512 ~ 2048
	canvasResolution = 1024

[zenithVisuals]
	#Visuals for the True Judgement Cut Slash Art (world slashes and screen effects). Client visuals only; damage is unaffected.
	enabled = true
	#Screen layer: cut lines, frozen frame and shattering. Shown to every player within 64 blocks of the cast.
	screenEffects = true
	#Strength of the white flashes. Lower it, or set 0, if bright flashes are uncomfortable.
	#Range: 0.0 ~ 1.0
	flashIntensity = 1.0
	#Animate the shader-drawn rift on the Zenith Rift blade, guard and sheath. When off, one still frame is drawn.
	bladeAnimation = true

[twilightProgression]
	#Send players entering the Twilight Forest to the portal in the nearest Final Castle, and send them back to the portal they came from.
	finalCastlePortal = true
	#Advancement a nearby player needs before a trophy pedestal removes the stronghold shields. Twilight Forest default: twilightforest:progress_lich.
	trophyPedestalAdvancement = "twilightforest:progress_naga"
	#Boss spawners only count nearby players who have the advancement. Format: <entity id>=<advancement id>.
	bossSpawnerGates = ["twilightforest:minoshroom=twilightforest:mazebreaker", "twilightforest:hydra=twilightforest:progress_labyrinth", "twilightforest:naga=twilightforest:progress_hydra", "twilightforest:knight_phantom=twilightforest:progress_trophy_pedestal", "twilightforest:ur_ghast=twilightforest:progress_knights", "twilightforest:lich=twilightforest:progress_ur_ghast", "twilightforest:alpha_yeti=twilightforest:progress_lich", "twilightforest:snow_queen=twilightforest:progress_yeti"]
	#Slowness amplifier added by the acid rain biome penalty. -1 disables it.
	#Range: -1 ~ 9
	acidRainSlowness = 1
	#Mining Fatigue amplifier added by the acid rain biome penalty. -1 disables it.
	#Range: -1 ~ 9
	acidRainMiningFatigue = 1
	#Duration of those effects in ticks. The penalty is refreshed every second.
	#Range: 20 ~ 1200
	acidRainEffectTicks = 100
	#Players can break Twilight Forest thorns instead of making them grow more thorns. Hardness is set by the modpack.
	thornsBreakable = true

