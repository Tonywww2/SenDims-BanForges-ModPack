		#中文：单次动作回血上限。
		#English: Action cap. 
		#Range: 0.0 ~ 1000000.0
		action_cap = 16.0
		#中文：判定窗口时间 · tick。
		#English: Window ticks · ticks. 
		#Range: > 1
		window_ticks = 100
		#中文：统计窗口内回血上限。
		#English: Window cap. 
		#Range: 0.0 ~ 1000000.0
		window_cap = 36.0

