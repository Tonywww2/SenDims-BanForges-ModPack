
#中文：装备与饰品。修改后重启。
#English: Equipment and curios. Restart after changes.
[equipment]

	#中文：武器属性。
	#English: Weapon attributes. 
	[equipment.weapons]

		#中文：奉献义手刀。
		#English: Consecrated prosthetic blade. 
		[equipment.weapons.consecrated_prosthetic_blade]
			#中文：攻击伤害。
			#English: Attack damage. 
			#Range: 1.0 ~ 1000000.0
			attack_damage = 9.0
			#中文：攻击速度。
			#English: Attack speed. 
			#Range: 0.01 ~ 20.0
			attack_speed = 1.6
			#中文：耐久上限。武器最大耐久，同时应用于已有和新制作的武器。
			#English: Durability. Maximum weapon durability, applying to both existing and newly crafted weapons.
			#Range: 1 ~ 1000000
			durability = 2300
			#中文：附魔能力。附魔台附魔能力；0关闭该武器的附魔台选项。
			#English: Enchantability. Enchanting-table quality; 0 disables enchanting-table offers for this weapon.
			#Range: 0 ~ 1000
			enchantability = 15

		#中文：年轻狮子大剑。
		#English: Young lion greatsword. 
		[equipment.weapons.young_lion_greatsword]
			#中文：攻击伤害。
			#English: Attack damage. 
			#Range: 1.0 ~ 1000000.0
			attack_damage = 12.0
			#中文：攻击速度。
			#English: Attack speed. 
			#Range: 0.01 ~ 20.0
			attack_speed = 1.0
			#中文：耐久上限。武器最大耐久，同时应用于已有和新制作的武器。
			#English: Durability. Maximum weapon durability, applying to both existing and newly crafted weapons.
			#Range: 1 ~ 1000000
			durability = 2400
			#中文：附魔能力。附魔台附魔能力；0关闭该武器的附魔台选项。
			#English: Enchantability. Enchanting-table quality; 0 disables enchanting-table offers for this weapon.
			#Range: 0 ~ 1000
			enchantability = 15

	#中文：Curios功能槽加成。
	#English: Functional Curios slot bonuses. 
	[equipment.curios]

		#中文：金针。
		#English: Golden needle. 
		[equipment.curios.golden_needle]
			#中文：腐败容量加成。玩家基础腐败容量为100；此值直接增加容量，0关闭加成。
			#English: Rot capacity bonus. Adds to the player's base scarlet rot capacity of 100; 0 disables the bonus.
			#Range: 0.0 ~ 1000000.0
			rot_capacity_bonus = 40.0

		#中文：奉献义手刀。
		#English: Consecrated prosthetic blade. 
		[equipment.curios.consecrated_prosthetic_blade]
			#中文：攻击速度加成。饰品攻击速度加成比例；0.10表示+10%，仅功能性Curios槽位生效。
			#English: Attack speed bonus. Curio attack speed bonus; 0.10 means +10%
			#Range: 0.0 ~ 10.0
			attack_speed_bonus = 0.1

		#中文：年轻狮子大剑。
		#English: Young lion greatsword. 
		[equipment.curios.young_lion_greatsword]
			#中文：攻击伤害加成。饰品攻击伤害加成比例；0.10表示+10%，仅功能性Curios槽位生效。
			#English: Attack damage bonus. Curio attack damage bonus; 0.10 means +10%
			#Range: 0.0 ~ 10.0
			attack_damage_bonus = 0.1
			#中文：击退抗性加成。直接增加击退抗性；0.10表示增加10个百分点。
			#English: Knockback resistance bonus. Flat knockback resistance addition; 0.10 adds 10 percentage points.
			#Range: 0.0 ~ 1.0
			knockback_resistance_bonus = 0.1

		#中文：渐隐光冠。
		#English: Circlet of fading light. 
		[equipment.curios.circlet_of_fading_light]
			#中文：护甲加成。
			#English: Armor bonus. 
			#Range: 0.0 ~ 1000.0
			armor_bonus = 2.0
			#中文：幸运加成。直接增加幸运，只影响使用幸运属性的战利品表。
			#English: Luck bonus. Flat luck addition, affecting only loot tables that use the luck attribute.
			#Range: -1024.0 ~ 1024.0
			luck_bonus = 1.0

#中文：Boss音乐。
#English: Boss music. 
[boss_music]
	#中文：启用。
	#English: Enabled. 
	enabled = true
	#中文：音量。音量增益：1为正常，2为两倍，0为静音；仍受音乐和主音量滑块控制。
	#English: Volume. Gain: 1 is normal, 2 doubles the amplitude, 0 mutes; music and master sliders still apply.
	#Range: 0.0 ~ 16.0
	volume = 0.85
	#中文：距离 · 格。
	#English: Distance · blocks. 
	#Range: 16.0 ~ 256.0
	distance = 96.0
	#中文：淡出时间 · tick。
	#English: Fade ticks · ticks. 
	#Range: 1 ~ 200
	fade_ticks = 40

#中文：地面技能范围指示器。
#English: Ground skill indicators. 
[indicators]
	#中文：启用。
	#English: Enabled. 
	enabled = true
	#中文：启用玛莲妮亚指示器。
	#English: Malenia enabled. 
	malenia_enabled = true
	#中文：启用拉塔恩指示器。
	#English: Promised consort enabled. 
	promised_consort_enabled = true
	#中文：透明度。地面范围指示器的透明度，0完全透明，1完全不透明；不影响服务端命中。
	#English: Opacity. Ground indicator opacity: 0 is invisible and 1 is opaque; server collision is unaffected.
	#Range: 0.1 ~ 1.0
	opacity = 0.6
	#中文：遮挡时边框透明度倍率。地面被遮挡时，边框透明度相对于正常显示的倍率。
	#English: Occluded outline opacity multiplier. Multiplier for outline opacity when the ground is occluded.
	#Range: 0.0 ~ 1.0
	occluded_outline_opacity_multiplier = 0.35
	#中文：渲染距离 · 格。
	#English: Render distance · blocks. 
	#Range: 1.0 ~ 256.0
	render_distance = 96.0
	#中文：离地偏移 · 格。指示器抬高到实际地面之上的距离，用于避免闪烁。
	#English: Surface offset · blocks. Height above real terrain for indicators, used to avoid flicker.
	#Range: 0.0 ~ 1.0
	surface_offset = 0.02
	#中文：同时显示的指示器上限。
	#English: Max active indicators. 
	#Range: 1 ~ 512
	max_active_indicators = 64
	#中文：单个形状的线段上限。
	#English: Max segments per shape. 
	#Range: 3 ~ 512
	max_segments_per_shape = 96

#中文：技能粒子预算。
#English: Skill particle budget. 
[skill_vfx]
	#中文：启用。
	#English: Enabled. 
	enabled = true
	#中文：每个Boss每tick的粒子预算 · tick。
	#English: Particle budget per boss per tick · ticks. 
	#Range: 1 ~ 128
	particle_budget_per_boss_per_tick = 18
	#中文：渲染距离 · 格。
	#English: Render distance · blocks. 
	#Range: 8.0 ~ 256.0
	render_distance = 96.0

#中文：玛莲妮亚／腐败女神。战斗设置在开战时生效。
#English: Malenia / Goddess of Rot. Combat settings apply when an encounter starts.
[malenia]

	#中文：基础属性。
	#English: Base attributes. 
	[malenia.general]
		#中文：一阶段生命值。
		#English: Phase one health. 
		#Range: 1.0 ~ 1000000.0
		phase_one_health = 900.0
		#中文：二阶段生命值。
		#English: Phase two health. 
		#Range: 1.0 ~ 1000000.0
		phase_two_health = 900.0
		#中文：二阶段开始生命比例。
		#English: Phase two start ratio. 
		#Range: 0.01 ~ 1.0
		phase_two_start_ratio = 0.8
		#中文：攻击伤害。
		#English: Attack damage. 
		#Range: 0.0 ~ 2048.0
		attack_damage = 20.0
		#中文：移动速度。
		#English: Movement speed. 
		#Range: 0.0 ~ 4.0
		movement_speed = 0.34
		#中文：追踪距离 · 格。
		#English: Follow range · blocks. 
		#Range: 1.0 ~ 2048.0
		follow_range = 56.0
		#中文：击退抗性。
		#English: Knockback resistance. 
		#Range: 0.0 ~ 1.0
		knockback_resistance = 0.75
		#中文：参战人数上限。
		#English: Max active players. 
		#Range: 1 ~ 4
		max_active_players = 4

	#中文：调试输出。
	#English: Debug output. 
	[malenia.debug]
		#中文：输出状态日志。
		#English: State output. 
		state_output = false
		#中文：播报技能。在聊天栏播报技能开始和结束。
		#English: Announce skills. Announce skill starts and endings in chat.
		action_broadcast = false

	#中文：多人缩放与轮换目标。
	#English: Multiplayer scaling and target rotation. 
	[malenia.multiplayer]
		#中文：每增加一名玩家的生命加成。
		#English: Health per extra player. 
		#Range: 0.0 ~ 10.0
		health_per_extra_player = 0.5
		#中文：每增加一名玩家的回血窗口上限加成。
		#English: Healing window cap per extra player. 
		#Range: 0.0 ~ 10.0
		healing_window_cap_per_extra_player = 0.15
		#中文：重新选取目标的间隔 · tick。
		#English: Retarget interval ticks · ticks. 
		#Range: > 1
		retarget_interval_ticks = 15
		#中文：连续锁定同一目标的惩罚起点 · tick。
		#English: Same target penalty after ticks · ticks. 
		#Range: > 0
		same_target_penalty_after_ticks = 180
		#中文：同一目标评分倍率。
		#English: Same target score multiplier. 
		#Range: 0.0 ~ 1.0
		same_target_score_multiplier = 0.78

	#中文：锁定与远程判断。
	#English: Targeting and ranged detection. 
	[malenia.targeting]
		#中文：距离评分权重。
		#English: Distance weight. 
		#Range: 0.0 ~ 100.0
		distance_weight = 0.45
		#中文：近期伤害评分权重。
		#English: Recent damage weight. 
		#Range: 0.0 ~ 100.0
		recent_damage_weight = 0.35
		#中文：使用物品评分权重。
		#English: Item use weight. 
		#Range: 0.0 ~ 100.0
		item_use_weight = 0.1
		#中文：中断反应权重。
		#English: Interrupt weight. 
		#Range: 0.0 ~ 100.0
		interrupt_weight = 0.1
		#中文：近期伤害统计窗口 · tick。
		#English: Recent damage window ticks · ticks. 
		#Range: > 1
		recent_damage_window_ticks = 160

	#中文：架势与失衡。
	#English: Stagger. 
	[malenia.stagger]
		#中文：伤害转为架势累积的比例。有效伤害转为架势累积的倍率；不改变Boss实际承受的生命伤害。
		#English: Damage conversion ratio. Multiplier converting effective damage into stagger buildup; does not alter health damage taken by the boss.
		#Range: 0.0 ~ 1.0
		damage_conversion_ratio = 1.0
		#中文：架势容量占生命上限的比例。架势上限相对于Boss生命上限的比例。
		#English: Capacity health ratio. Stagger capacity as a fraction of the boss's maximum health.
		#Range: 0.001 ~ 1.0
		capacity_health_ratio = 0.25
		#中文：快速失衡保护统计窗口 · tick。统计近期架势增长的时间窗口，用于快速失衡保护。
		#English: Rapid window ticks · ticks. Window for tracking recent stagger growth for rapid stagger protection.
		#Range: 1 ~ 1000000
		rapid_window_ticks = 240
		#中文：快速失衡保护分档比例。快速增长触发的分档比例；0.25表示按25%容量档位保护。
		#English: Rapid fraction. Capacity fraction for rapid growth protection tiers; 0.25 means 25% capacity tiers.
		#Range: 0.001 ~ 0.999
		rapid_fraction = 0.25
		#中文：相同伤害来源去重窗口 · tick。
		#English: dedupe ticks · ticks. 
		#Range: > 0
		source_dedupe_ticks = 5
		#中文：架势衰减前的等待时间 · tick。
		#English: Decay delay ticks · ticks. 
		#Range: > 0
		decay_delay_ticks = 120
		#中文：每tick架势衰减量 · tick。
		#English: Decay per tick · ticks. 
		#Range: 0.0 ~ 1000000.0
		decay_per_tick = 1.5
		#中文：失衡硬直时间 · tick。
		#English: Stun ticks · ticks. 
		#Range: > 1
		stun_ticks = 70
		#中文：硬直结束后的架势保护时间 · tick。
		#English: Post stun immunity ticks · ticks. 
		#Range: > 1
		post_stun_immunity_ticks = 80
		#中文：转阶段时重置架势。
		#English: Reset on phase change. 
		reset_on_phase_change = true

		#中文：距离分档规则。最后一档距离为-1时不限距离。
		#English: Distance bands. A final distance of -1 has no limit.
		[malenia.stagger.distance_bands]

			#中文：距离档位1。
			#English: Distance band 1. 
			[malenia.stagger.distance_bands.stage1]
				#中文：该档距离上限 · 格。此距离档的上限，单位为格；最后一档填-1表示覆盖剩余距离，其他档位从小到大排列。
				#English: Max distance · blocks. Distance ceiling in blocks; use -1 in the final band for the remaining distance and order other bands from near to far.
				max_distance = 4.0
				#中文：该档架势累积倍率。此距离档的架势累积倍率；1表示原值，0停止该档的累积。
				#English: Multiplier. Stagger buildup multiplier for this distance band; 1 preserves the base value and 0 prevents buildup in this band.
				multiplier = 1.0

			#中文：距离档位2。
			#English: Distance band 2. 
			[malenia.stagger.distance_bands.stage2]
				#中文：该档距离上限 · 格。此距离档的上限，单位为格；最后一档填-1表示覆盖剩余距离，其他档位从小到大排列。
				#English: Max distance · blocks. Distance ceiling in blocks; use -1 in the final band for the remaining distance and order other bands from near to far.
				max_distance = 8.0
				#中文：该档架势累积倍率。此距离档的架势累积倍率；1表示原值，0停止该档的累积。
				#English: Multiplier. Stagger buildup multiplier for this distance band; 1 preserves the base value and 0 prevents buildup in this band.
				multiplier = 0.7

			#中文：距离档位3。
			#English: Distance band 3. 
			[malenia.stagger.distance_bands.stage3]
				#中文：该档距离上限 · 格。此距离档的上限，单位为格；最后一档填-1表示覆盖剩余距离，其他档位从小到大排列。
				#English: Max distance · blocks. Distance ceiling in blocks; use -1 in the final band for the remaining distance and order other bands from near to far.
				max_distance = 16.0
				#中文：该档架势累积倍率。此距离档的架势累积倍率；1表示原值，0停止该档的累积。
				#English: Multiplier. Stagger buildup multiplier for this distance band; 1 preserves the base value and 0 prevents buildup in this band.
				multiplier = 0.4

			#中文：距离档位4。
			#English: Distance band 4. 
			[malenia.stagger.distance_bands.stage4]
				#中文：该档距离上限 · 格。此距离档的上限，单位为格；最后一档填-1表示覆盖剩余距离，其他档位从小到大排列。
				#English: Max distance · blocks. Distance ceiling in blocks; use -1 in the final band for the remaining distance and order other bands from near to far.
				max_distance = -1.0
				#中文：该档架势累积倍率。此距离档的架势累积倍率；1表示原值，0停止该档的累积。
				#English: Multiplier. Stagger buildup multiplier for this distance band; 1 preserves the base value and 0 prevents buildup in this band.
				multiplier = 0.2

	#中文：瞬防与提示。
	#English: Instant guard and cues. 
	[malenia.instant_guard]
		#中文：启用。
		#English: Enabled. 
		enabled = true
