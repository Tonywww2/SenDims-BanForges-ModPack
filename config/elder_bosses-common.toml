	#中文：入伤抗性。
	#English: Incoming damage resistance. 
	[malenia.resistance]

		#中文：一阶段。
		#English: Phase one. 
		[malenia.resistance.phase_one]
			#中文：物理伤害抗性。入伤倍率：1正常，0免疫。
			#English: Physical. Incoming multiplier: 1 normal, 0 immune.
			#Range: 0.0 ~ 100.0
			physical = 0.9
			#中文：火焰伤害抗性。入伤倍率：1正常，0免疫。
			#English: Fire. Incoming multiplier: 1 normal, 0 immune.
			#Range: 0.0 ~ 100.0
			fire = 1.0
			#中文：魔法伤害抗性。入伤倍率：1正常，0免疫。
			#English: Magic. Incoming multiplier: 1 normal, 0 immune.
			#Range: 0.0 ~ 100.0
			magic = 0.8
			#中文：雷电伤害抗性。入伤倍率：1正常，0免疫。
			#English: Lightning. Incoming multiplier: 1 normal, 0 immune.
			#Range: 0.0 ~ 100.0
			lightning = 0.8

		#中文：二阶段。
		#English: Phase two. 
		[malenia.resistance.phase_two]
			#中文：物理伤害抗性。入伤倍率：1正常，0免疫。
			#English: Physical. Incoming multiplier: 1 normal, 0 immune.
			#Range: 0.0 ~ 100.0
