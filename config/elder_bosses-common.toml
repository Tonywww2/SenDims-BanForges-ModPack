			flat = 1.0
			#中文：攻击力系数。攻击力系数。
			#English: Attack ratio. Attack damage coefficient.
			attack_ratio = 0.06

		#中文：重攻击回血。
		#English: Heavy heal. 
		[malenia.healing.heavy_heal]
			#中文：固定伤害加值。固定加值。
			#English: Flat. Flat addition.
			flat = 2.0
			#中文：攻击力系数。攻击力系数。
			#English: Attack ratio. Attack damage coefficient.
			attack_ratio = 0.08

