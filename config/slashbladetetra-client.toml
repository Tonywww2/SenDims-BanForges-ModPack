EnableRenderWrapper = true

[SlashEffectRender]
	#刀光亮度分流阈值 (0.0~1.0)。
	#感知亮度低于此值的颜色（如黑色/深色）使用标准混合渲染原色，保证可见；
	#高于此值的颜色使用加法辉光渲染（发光）。
	#0.0 表示所有颜色都走加法辉光（纯原版行为，黑色不可见）。
	#Range: 0.0 ~ 1.0
	slashEffectMinLuminance = 0.25
	#刀光透明度系数 (0.0~1.0)。
	#Range: 0.0 ~ 1.0
	slashEffectAlphaMultiplier = 1.0
	#幻影剑透明度 (0~255)，255 为原版不透明。
	#Range: 0 ~ 255
	summonedSwordAlpha = 255

